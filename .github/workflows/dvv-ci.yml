# Reusable CI of the dvv repositories, part of dvv-build. Three layouts:
#   lib   a dvv library calls it with
#           jobs: { ci: { uses: <owner>/dvv-build/.github/workflows/dvv-ci.yml@v<X>,
#                         with: { repo: <library name> } } }
#         where X is the dvv-build line of its dvv-deps.txt (check-pins.cmake checks it). The dvv
#         root is the workspace: <library>/, dvv-build/ at this workflow's commit (tag v<X>), and
#         the dependencies that fetch-deps.cmake clones at their minimum tags. A library branch may
#         call it @<dvv-build branch> to test against unreleased dvv-build; check-pins fails then.
#   app   an application with the dvv repositories as submodules in libs/ adds `app: true`
#         (and `test-dependencies` to run the libraries' tests at the pins). The dvv root is
#         <app>/libs and dvv-build is the pinned libs/dvv-build.
#   self  dvv-build's own ci.yml calls it with `repo: dvv-build`: dvv-build alone, its own tests.
# The Linux build jobs and tidy run in the CI image of this dvv-build; lint, Windows and macOS
# install the tools of the dvv-build in use (lint runs on the host: the image pull took longer
# than the job).
# Jobs: dvv-build-min, then per OS a prime job (prime-windows, prime-linux, prime-macos) that fills
# the toolchain's wxWidgets and third-party caches, then that OS's build jobs (windows, linux,
# macos), which only restore them. Libraries and applications also get lint (privacy lint,
# OS blocks, Format, check-pins; no prime job) and tidy (clang-tidy on the files of the Linux
# Clang compile database, after prime-linux).
name: dvv-ci

on:
  workflow_call:
    inputs:
      repo:
        description: Name of the calling repository, e.g. dvv-base
        required: true
        type: string
      app:
        description: The caller is an application with the dvv repositories as submodules in libs/
        required: false
        type: boolean
        default: false
      test-dependencies:
        description: Also build and run the tests of the dvv dependencies (DVV_TEST_DEPENDENCIES)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # self, lib or app (see the header).
  DVV_LAYOUT: ${{ inputs.repo == 'dvv-build' && 'self' || (inputs.app && 'app' || 'lib') }}
  # The dvv root and the dvv-build in use, relative to the workspace.
  DVV_ROOT: ${{ inputs.app && format('{0}/libs', inputs.repo) || '.' }}
  DVV_BUILD: ${{ inputs.app && format('{0}/libs/dvv-build', inputs.repo) || 'dvv-build' }}
  DVV_REPO: ${{ inputs.repo }}
  # The CI image of prime-linux, the linux matrix and tidy (ci-image/, ci-image.yml), by digest only.
  DVV_CI_IMAGE: dvv-build-ci@sha256:154d2198606d8dd26a030942ef1b2bcf1efd6de3b26c3a826159348d0dd8641f

jobs:
  # Lib layout: the dvv-build line of <repo>/dvv-deps.txt, needed before dvv-build is checked out.
  # The rules are those of cmake/DvvDepsFile.cmake: the line may be anywhere, a CR before the line
  # end and a UTF-8 BOM are dropped, it appears exactly once and its version is <major>.<minor>.<patch>.
  # fetch-deps.cmake checks the whole file afterwards. Other layouts: an empty version.
  # Every layout: the reference of the CI image and the runner account (uid:gid) that the jobs in the
  # image (prime-linux, linux, tidy) run it as. The job stays on the host and installs nothing.
  dvv-build-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      user: ${{ steps.image.outputs.user }}
    steps:
      - uses: actions/checkout@v5
        if: env.DVV_LAYOUT == 'lib'
        with:
          path: ${{ inputs.repo }}
      - name: Read the dvv-build minimum
        id: read
        if: env.DVV_LAYOUT == 'lib'
        shell: bash
        run: |
          file="$DVV_REPO/dvv-deps.txt"
          if [ ! -f "$file" ]; then
            echo "::error::$file does not exist; it needs a 'dvv-build <major>.<minor>.<patch>' line"
            exit 1
          fi
          lines=$(tr -d '\r' < "$file" | sed '1s/^\xEF\xBB\xBF//' | awk '$1 == "dvv-build"')
          count=$(printf '%s' "$lines" | grep -c '^' || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::$file needs exactly one 'dvv-build <major>.<minor>.<patch>' line, found $count"
            exit 1
          fi
          if ! printf '%s\n' "$lines" | grep -Eq '^[[:space:]]*dvv-build[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$'; then
            echo "::error::$file: bad line '$lines' (expected 'dvv-build <major>.<minor>.<patch>')"
            exit 1
          fi
          version=$(printf '%s\n' "$lines" | awk '{ print $2 }')
          echo "$DVV_REPO needs dvv-build $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: CI image
        id: image
        shell: bash
        env:
          # The dvv-build whose workflow runs owns the image. A fork of dvv-build that runs its own CI
          # sets the repository variable DVV_CI_IMAGE_OWNER to the upstream account; the digest pins
          # the content wherever it is pulled from.
          OWNER: ${{ vars.DVV_CI_IMAGE_OWNER || job.workflow_repository || github.repository }}
        run: |
          owner=${OWNER%%/*}
          echo "image=ghcr.io/${owner,,}/$DVV_CI_IMAGE" >> "$GITHUB_OUTPUT"
          # The runner account of this runner image: the container runs as it (no root).
          echo "user=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"

  # Prime jobs, one per OS and toolchain: they fill the two third-party caches of their toolchain
  # once, so the build jobs of that OS only restore them. Two entries per toolchain <tc>:
  #   wxWidgets  path <DVV_ROOT>/_third_party/<tc>-wx (bootstrap's separate wxWidgets prefix), key
  #              wx-<runner.os>-<tc>-<wx hash>-<compiler>: the first 16 hex digits of the hash in
  #              its inputs marker (tools/separate-prefix-hash.cmake) and of a SHA256 of the
  #              compiler's version (Linux: clang-19 --version; Windows: the default MSVC toolset's
  #              and the Windows SDK's version; macOS: Apple clang's version line and the macOS
  #              SDK's version and build).
  #   prefix     path <DVV_ROOT>/_third_party/<tc>, key third-party-<runner.os>-<tc>-<hash of
  #              deps/**, cmake/DvvThirdParty.cmake and cmake/DvvSpdx.cmake>-<compiler>: the
  #              inputs of bootstrap's own up-to-date stamp and the same 16 hex digits of the
  #              compiler as the wxWidgets key (the prefix holds static libraries too).
  # Bootstrap's marker and stamp leave the compiler out, so a key hit takes its fast path. The
  # compiler is the toolset and SDK, not the IDE: Visual Studio's and Xcode's own build versions
  # are in neither key, since runner images change them with the same toolset and SDK.
  # On Linux both keys end with -<first 16 hex digits of the CI image's environment hash>
  # (/etc/dvv-ci-image/environment.sha256): the prefix embeds its absolute path (/__w in the
  # container), and the hash covers every package and Python tool version of the image.
  # A third entry, downloads (path <DVV_ROOT>/_build/downloads, key downloads-<runner.os>-<hash of
  # the URL and SHA256 lines of deps/versions.cmake>), keeps the archives bootstrap downloads; a
  # prime job with work to do restores it, falling back to an older entry, so it downloads only what
  # the pins changed.
  # A prime job looks both keys up without downloading; when both exist it stops there. Otherwise it
  # restores what exists, bootstraps (the superbuild runs whole: with a fresh build tree it
  # reinstalls the prefix too, and skips wx when its marker matches) and saves each missed entry.
  # The path string is part of a cache entry's version: another job or workflow shares an entry
  # only with the same key and exactly the same path (./_third_party/<tc>[-wx] or
  # <app>/libs/_third_party/<tc>[-wx]).
  prime-windows:
    needs: dvv-build-min
    runs-on: windows-2025
    # A miss of both entries builds the whole third-party prefix, wxWidgets most of it.
    timeout-minutes: 180
    env:
      TOOLCHAIN: msvc
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          path: ${{ inputs.repo }}
          submodules: ${{ inputs.app && 'recursive' || 'false' }}
      - &checkout-dvv-build
        uses: actions/checkout@v5
        if: env.DVV_LAYOUT == 'lib'
        with:
          repository: ${{ github.repository_owner }}/dvv-build
          # The commit of this workflow: @v<X> on main (check-pins), a dvv-build branch while a
          # dependent tests against it before the tag exists. The tag where job.workflow_sha is absent.
          ref: ${{ job.workflow_sha || format('v{0}', needs.dvv-build-min.outputs.version) }}
          path: dvv-build
      - &setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - &install-tools
        name: Install tools
        timeout-minutes: 15
        run: python -m pip install --retries 10 --timeout 60 -r ${{ env.DVV_BUILD }}/tools/requirements.txt
      # Cheap, so before the keys (which read the same Visual Studio installation).
      - &check-vs
        name: Check Visual Studio 2026
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $version = & $vswhere -latest -property catalog_productDisplayVersion
          if (-not $version.StartsWith('18.')) { throw "Visual Studio 2026 (18.x) required, found $version" }
          Write-Host "Visual Studio $version"
      # The key steps are shared by the prime and build jobs of the OS (YAML anchors), so both
      # compute the same keys.
      - &keys-windows
        name: Cache keys
        id: keys
        shell: pwsh
        env:
          PREFIX_HASH: ${{ hashFiles(format('{0}/deps/**', env.DVV_BUILD), format('{0}/cmake/DvvThirdParty.cmake', env.DVV_BUILD), format('{0}/cmake/DvvSpdx.cmake', env.DVV_BUILD)) }}
        run: |
          $script = Join-Path $env:DVV_BUILD 'tools/separate-prefix-hash.cmake'
          $out = (& cmake -DNAME=wxWidgets "-DTOOLCHAIN=$env:TOOLCHAIN" -P $script) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^hash=([0-9a-f]{64})$') {
            throw "tools/separate-prefix-hash.cmake failed ($LASTEXITCODE): $out"
          }
          $wxHash = $Matches[1].Substring(0, 16)
          # What both prefixes are compiled with: the MSVC toolset that MSBuild and vcvars default
          # to (VC\Tools\MSVC\<version>) and the newest Windows SDK with um\windows.h in the kits
          # root of the registry's 32-bit view, the one CMake's Visual Studio generator selects
          # with policy CMP0149 NEW (dvv_third_party_common_args() sets it for every project).
          # Not Visual Studio's own build: image updates change it alone.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -property installationPath
          $msvcFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          $msvc = (Test-Path $msvcFile) ? "$(Get-Content $msvcFile -Raw)".Trim() : ''
          $msvcPath = Join-Path $vsPath "VC\Tools\MSVC\$msvc"
          if ($msvc -notmatch '^\d+(\.\d+)+$' -or -not (Test-Path $msvcPath)) {
            throw "No default MSVC toolset in '$vsPath' (Microsoft.VCToolsVersion.default.txt: '$msvc')"
          }
          $roots = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots'
          $kits = (Get-ItemProperty $roots -ErrorAction SilentlyContinue).KitsRoot10
          $sdk = ''
          if ($kits) {
            $sdk = (Get-ChildItem (Join-Path $kits 'Include') -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
              Where-Object { Test-Path (Join-Path $_.FullName 'um\windows.h') } |
              Sort-Object { [version]$_.Name } | Select-Object -Last 1).Name
          }
          if (-not $sdk) { throw "No Windows SDK with um\windows.h in the kits root '$kits'" }
          Write-Host "Toolchain: MSVC $msvc, Windows SDK $sdk"
          $text = "MSVC $msvc`nWindows SDK $sdk`n"
          $sha = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($text))
          $toolchain = [Convert]::ToHexString($sha).ToLowerInvariant().Substring(0, 16)
          "wx=wx-$env:RUNNER_OS-$env:TOOLCHAIN-$wxHash-$toolchain" >> $env:GITHUB_OUTPUT
          "prefix=third-party-$env:RUNNER_OS-$env:TOOLCHAIN-$env:PREFIX_HASH-$toolchain" >> $env:GITHUB_OUTPUT
          # The pins only (the URL and SHA256 lines of versions.cmake): an edit elsewhere in the
          # file keeps the downloads entry.
          $pinLines = Get-Content (Join-Path $env:DVV_BUILD 'deps/versions.cmake') |
            Where-Object { $_ -match '^\s*(URL|SHA256)\s' } | ForEach-Object { $_.Trim() }
          $pinBytes = [Text.Encoding]::UTF8.GetBytes(($pinLines -join "`n") + "`n")
          $pins = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($pinBytes)).ToLowerInvariant()
          "downloads=downloads-$env:RUNNER_OS-$pins" >> $env:GITHUB_OUTPUT
      - &lookup-wx
        name: Look up wxWidgets
        id: wx-lookup
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
          lookup-only: true
      - &lookup-prefix
        name: Look up third-party
        id: prefix-lookup
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
          lookup-only: true
      # run=false when both entries exist: every later step of the prime job is skipped.
      - &need
        name: Anything to prime?
        id: need
        shell: bash
        env:
          WX_HIT: ${{ steps.wx-lookup.outputs.cache-hit }}
          PREFIX_HIT: ${{ steps.prefix-lookup.outputs.cache-hit }}
        run: |
          if [ "$WX_HIT" = true ] && [ "$PREFIX_HIT" = true ]; then
            echo "Both cache entries exist; nothing to prime."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "wxWidgets cached: ${WX_HIT:-false}; third-party cached: ${PREFIX_HIT:-false}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Exact keys only (no restore-keys): another wxWidgets or prefix must never be restored.
      - &prime-restore-wx
        name: Restore wxWidgets
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
      - &prime-restore-prefix
        name: Restore third-party
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
      # The downloaded archives (bootstrap keeps them in <root>/_build/downloads), so a prime job
      # downloads only what its pins changed. An older entry may be restored (restore-keys): the
      # superbuild uses an archive only when its SHA256 matches the pin and downloads the others.
      - &prime-restore-downloads
        name: Restore downloads
        id: downloads
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_build/downloads
          key: ${{ steps.keys.outputs.downloads }}
          restore-keys: downloads-${{ runner.os }}-
      # A superbuild of what is missing: it skips wxWidgets when the restored marker matches.
      - name: Bootstrap
        if: steps.need.outputs.run == 'true'
        shell: pwsh
        run: ./${{ env.DVV_BUILD }}/bootstrap.ps1 -Toolchain $env:TOOLCHAIN
      # Saved right after bootstrap. When two runs miss together, the first save wins and the other
      # only warns.
      - &save-wx
        name: Save wxWidgets
        if: steps.need.outputs.run == 'true' && steps.wx-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
      - &save-prefix
        name: Save third-party
        if: steps.need.outputs.run == 'true' && steps.prefix-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
      - &save-downloads
        name: Save downloads
        if: steps.need.outputs.run == 'true' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DVV_ROOT }}/_build/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}

  prime-linux:
    needs: dvv-build-min
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: &linux-container
      image: ${{ needs.dvv-build-min.outputs.image }}
      # The runner account's uid:gid (tests must not run as root); tini reaps orphans as the host's
      # init does; the host's IPC namespace and /dev/shm; no seccomp filter, as on the host (TSan's
      # personality(ADDR_NO_RANDOMIZE) re-exec). The host's soft core limit is 0: crash and death
      # tests must not write core files.
      options: >-
        --user ${{ needs.dvv-build-min.outputs.user }}
        --init --ipc=host --security-opt seccomp=unconfined
        --ulimit core=0:-1
    defaults: &linux-defaults
      run:
        shell: bash -e {0}
    env:
      TOOLCHAIN: clang
    steps:
      - *checkout
      - *checkout-dvv-build
      - &check-ci-image
        name: Check the CI image
        run: cmake "-DDVV_BUILD=$DVV_BUILD" -P "$DVV_BUILD/tools/check-ci-image.cmake"
      # The compiler comes from the CI image; its version is part of both keys.
      - &keys-unix
        name: Cache keys
        id: keys
        shell: bash
        env:
          PREFIX_HASH: ${{ hashFiles(format('{0}/deps/**', env.DVV_BUILD), format('{0}/cmake/DvvThirdParty.cmake', env.DVV_BUILD), format('{0}/cmake/DvvSpdx.cmake', env.DVV_BUILD)) }}
        run: |
          out=$(cmake -DNAME=wxWidgets "-DTOOLCHAIN=$TOOLCHAIN" -P "$DVV_BUILD/tools/separate-prefix-hash.cmake")
          wx_hash=${out#hash=}
          if ! [[ $wx_hash =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tools/separate-prefix-hash.cmake printed '$out'"
            exit 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            compiler=$(clang-19 --version)
            env_file=/etc/dvv-ci-image/environment.sha256
            image_env=
            [ -r "$env_file" ] && image_env=$(head -n 1 "$env_file")
            if ! [[ $image_env =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::$env_file is missing or not a SHA-256 (not in the CI image?)"; exit 1
            fi
            suffix="-${image_env:0:16}"
          else
            # What both prefixes are compiled with: bootstrap's /usr/bin/clang (its first version
            # line names the Apple clang build) and the SDK that SDKROOT selects, by version and
            # build. Not Xcode's own version: an image can change it with the same clang and SDK.
            clang_version=$(/usr/bin/clang --version)
            sdk_version=$(xcrun --show-sdk-version)
            sdk_build=$(xcrun --show-sdk-build-version)
            compiler=$(printf '%s\nmacOS SDK %s (%s)' "${clang_version%%$'\n'*}" "$sdk_version" \
              "$sdk_build")
            suffix=
          fi
          echo "Compiler:"
          echo "$compiler"
          fingerprint=$(printf '%s\n' "$compiler" | shasum -a 256 | cut -c1-16)
          echo "wx=wx-$RUNNER_OS-$TOOLCHAIN-${wx_hash:0:16}-$fingerprint$suffix" >> "$GITHUB_OUTPUT"
          echo "prefix=third-party-$RUNNER_OS-$TOOLCHAIN-$PREFIX_HASH-$fingerprint$suffix" >> "$GITHUB_OUTPUT"
          # The pins only (the URL and SHA256 lines of versions.cmake): an edit elsewhere in the
          # file keeps the downloads entry.
          pins=$(grep -E '^[[:space:]]*(URL|SHA256)[[:space:]]' "$DVV_BUILD/deps/versions.cmake" |
            sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | shasum -a 256 | cut -c1-64)
          echo "downloads=downloads-$RUNNER_OS-$pins" >> "$GITHUB_OUTPUT"
      - *lookup-wx
      - *lookup-prefix
      - *need
      - *prime-restore-wx
      - *prime-restore-prefix
      - *prime-restore-downloads
      - name: Bootstrap
        if: steps.need.outputs.run == 'true'
        run: ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      - *save-wx
      - *save-prefix
      - *save-downloads

  prime-macos:
    needs: dvv-build-min
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TOOLCHAIN: appleclang
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      # Before the keys: the SDK is part of both keys. The selected Xcode's own
      # macOS SDK for every later step. A plain xcrun can pick the Command Line Tools' SDK, which
      # an image may update past the selected Xcode (xcode-27 20261112: CLT MacOSX27.2.sdk with
      # Xcode 27.1, which then cannot read it); with SDKROOT the Xcode and its SDK always match.
      - &macos-sdk
        name: Select the SDK of the selected Xcode
        shell: bash
        run: |
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          echo "Xcode $(xcode-select -p), SDK $sdk ($(SDKROOT=$sdk xcrun --show-sdk-version))"
      - *keys-unix
      - *lookup-wx
      - *lookup-prefix
      - *need
      - *prime-restore-wx
      - *prime-restore-prefix
      - *prime-restore-downloads
      - name: Bootstrap
        if: steps.need.outputs.run == 'true'
        run: ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      - *save-wx
      - *save-prefix
      - *save-downloads

  # Build jobs, one matrix per OS after its prime job. They restore both entries and never save;
  # bootstrap takes its fast path (or, if an entry is still missing, builds it). Windows: one job
  # per configuration (`preset` configures, `config` names the build and test presets), so Debug
  # and Release build and test in parallel. Linux runs the workflow preset. macOS runs the
  # configure, build and test steps of its preset itself (see its "Build and test" step); the
  # ninja-macos entry also builds and tests Release, as the workflow preset does.
  windows:
    name: ${{ matrix.name }}
    needs: [dvv-build-min, prime-windows]
    runs-on: windows-2025
    # A missing cache entry builds it first.
    timeout-minutes: 180
    env:
      TOOLCHAIN: msvc
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc, preset: vs2026, config: vs2026 }
          - { name: windows-msvc-release, preset: vs2026, config: vs2026-release }
          - { name: windows-msvc-asan, preset: vs2026-asan, config: vs2026-asan }
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      - &fetch-deps
        name: Fetch the dvv dependencies
        if: env.DVV_LAYOUT == 'lib'
        env:
          DVV_GIT_BASE_URL: ${{ github.server_url }}/${{ github.repository_owner }}
        run: cmake "-DREPO=${{ inputs.repo }}" -P dvv-build/tools/fetch-deps.cmake
      - *check-vs
      - *keys-windows
      - &restore-wx
        name: Restore wxWidgets
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
      - &restore-prefix
        name: Restore third-party
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
      # The fast path when both entries were restored; otherwise it builds what is missing.
      - name: Bootstrap
        shell: pwsh
        run: ./${{ env.DVV_BUILD }}/bootstrap.ps1 -Toolchain $env:TOOLCHAIN
      # Windows runners have no GPU: the GPU and GUI tests exit with 77 and CTest reports them as
      # skipped; the display tests that need only a window run. The three steps are the workflow
      # preset's steps for one configuration.
      - name: Configure
        working-directory: ${{ inputs.repo }}
        env:
          DVV_TEST_DEPENDENCIES: ${{ inputs.test-dependencies && 'ON' || '' }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: ${{ inputs.repo }}
        run: cmake --build --preset ${{ matrix.config }}
      - name: Test
        working-directory: ${{ inputs.repo }}
        env:
          DVV_REQUIRE_FFMPEG: "1"
        run: ctest --preset ${{ matrix.config }}

  linux:
    name: ${{ matrix.name }}
    needs: [dvv-build-min, prime-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: *linux-container
    defaults: *linux-defaults
    env:
      TOOLCHAIN: clang
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-clang, preset: ninja-clang }
          - { name: linux-clang-asan, preset: ninja-clang-asan }
          - { name: linux-clang-tsan, preset: ninja-clang-tsan }
    steps:
      - *checkout
      - *checkout-dvv-build
      - *check-ci-image
      # Sanitizer canaries (dvv-build's own CI only): LSan and TSan work in the container.
      - name: Sanitizer canaries
        if: env.DVV_LAYOUT == 'self' && matrix.preset != 'ninja-clang'
        env:
          SANITIZER: ${{ matrix.preset == 'ninja-clang-asan' && 'address' || 'thread' }}
        run: |
          cmake "-DSANITIZER=$SANITIZER" -DCXX=clang++-19 "-DWORK_DIR=$RUNNER_TEMP/sanitizers" -P "$DVV_BUILD/tests/ci/test_sanitizers.cmake"
      - *fetch-deps
      # Linux runs the GPU tests on Mesa's lavapipe (Vulkan 1.4 from the CI image).
      - name: Check the Vulkan device
        run: cmake -P "$DVV_BUILD/tools/check-vulkan-device.cmake"
      - *keys-unix
      - *restore-wx
      - *restore-prefix
      - &bootstrap-linux
        name: Bootstrap
        run: ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      # The GPU and display tests must run (a missing device or display fails them) with
      # synchronization validation through the third-party prefix's layer, on a virtual X server.
      # NO_AT_BRIDGE keeps GTK from looking for the accessibility bus. TSAN_OPTIONS stays unset: the
      # GPU tests pass their own suppressions through CTest.
      - name: Build and test
        working-directory: ${{ inputs.repo }}
        env:
          DVV_REQUIRE_GPU: "1"
          DVV_REQUIRE_FFMPEG: "1"
          DVV_VK_VALIDATION: sync
          DVV_VK_VALIDATION_REQUIRED: "1"
          NO_AT_BRIDGE: "1"
          DVV_TEST_DEPENDENCIES: ${{ inputs.test-dependencies && 'ON' || '' }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cmake --workflow --preset ${{ matrix.preset }}

  macos:
    name: ${{ matrix.name }}
    needs: [dvv-build-min, prime-macos]
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TOOLCHAIN: appleclang
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-appleclang, preset: ninja-macos }
          - { name: macos-appleclang-asan, preset: ninja-macos-asan }
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      - *fetch-deps
      - *macos-sdk
      - *keys-unix
      - *restore-wx
      - *restore-prefix
      - name: Bootstrap
        run: ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      # The Vulkan driver of the GPU tests (tools/select-vulkan-driver.cmake): the prefix's KosmicKrisp
      # when the runner's Metal device can run it (spec C10: the paravirtual device of GitHub's runners
      # cannot), otherwise Mesa's lavapipe from Homebrew's mesa bottle. lavapipe is a CI-only
      # exception to U-MAC2 (KosmicKrisp only), never in the prefix or a package, as Linux CI takes
      # it from the CI image. A prefix without KosmicKrisp or a failed lavapipe fails the job; the repository
      # variable DVV_MACOS_SOFTWARE_GPU=off skips lavapipe (the GPU tests then skip), a way out of a
      # bad Homebrew bottle without a release. Outputs: driver (kosmickrisp, lavapipe or none),
      # manifest and display (1 only on KosmicKrisp with a desktop session).
      - name: Choose the Vulkan driver
        id: vulkan
        timeout-minutes: 20
        env:
          SWITCH: ${{ vars.DVV_MACOS_SOFTWARE_GPU }}
          PREFIX: ${{ github.workspace }}/${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
        run: cmake "-DPREFIX=$PREFIX" "-DSWITCH=$SWITCH" -P "$DVV_BUILD/tools/select-vulkan-driver.cmake"
      # Only the chosen driver and the validation layer load: Homebrew's mesa also installs MoltenVK
      # and its own KosmicKrisp, which must never load, and no other layer may join.
      - name: Check what the Vulkan loader loads
        if: steps.vulkan.outputs.driver != 'none'
        env:
          MANIFEST: ${{ steps.vulkan.outputs.manifest }}
          PREFIX: ${{ github.workspace }}/${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
        run: |
          log=$(env VK_DRIVER_FILES="$MANIFEST" VK_LOADER_DEBUG=driver,layer \
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            VK_ADD_LAYER_PATH="$PREFIX/share/vulkan/explicit_layer.d" \
            DYLD_FALLBACK_LIBRARY_PATH="$PREFIX/lib" "$PREFIX/bin/vulkaninfo" --summary 2>&1) ||
            { printf '%s\n' "$log"; echo "::error::vulkaninfo failed with VK_LOADER_DEBUG"; exit 1; }
          drivers=$(printf '%s\n' "$log" |
            sed -n 's/.*DRIVER: *Found ICD manifest file \(.*\), version.*/\1/p' | sort -u)
          layers=$(printf '%s\n' "$log" |
            sed -n 's/.*LAYER: *\(VK_LAYER_[A-Za-z0-9_]*\)[[:space:]]*$/\1/p' | sort -u)
          echo "Driver manifests the loader found: $drivers"
          echo "Active layers: $layers"
          if [ "$drivers" != "$MANIFEST" ] || [ "$layers" != VK_LAYER_KHRONOS_validation ]; then
            printf '%s\n' "$log" | grep -E 'DRIVER|LAYER' || true
            echo "::error::the loader loaded more than the chosen driver and the validation layer"
            exit 1
          fi
      # The workflow preset's steps for this entry. With a driver, the tests run on it
      # (DVV_TEST_VK_DRIVER_FILES) and the GPU tests are required with synchronization validation, as
      # on Linux; the display tests only when the driver step allows them (`-LE display` otherwise).
      # Without one (DVV_MACOS_SOFTWARE_GPU=off) the GPU tests skip. ninja-macos builds and tests
      # Release too. FFmpeg (custom_ffmpeg in the prefix) is required as on Windows and Linux.
      - name: Build and test
        working-directory: ${{ inputs.repo }}
        env:
          DRIVER: ${{ steps.vulkan.outputs.driver }}
          MANIFEST: ${{ steps.vulkan.outputs.manifest }}
          DISPLAY_TESTS: ${{ steps.vulkan.outputs.display }}
          DVV_REQUIRE_FFMPEG: "1"
          DVV_TEST_DEPENDENCIES: ${{ inputs.test-dependencies && 'ON' || '' }}
          PRESET: ${{ matrix.preset }}
        run: |
          configure=()
          tests=()
          if [ "$DRIVER" != none ]; then
            export DVV_REQUIRE_GPU=1 DVV_VK_VALIDATION=sync DVV_VK_VALIDATION_REQUIRED=1
            configure=("-DDVV_TEST_VK_DRIVER_FILES=$MANIFEST")
          fi
          if [ "$DISPLAY_TESTS" != 1 ]; then tests=(-LE display); fi
          presets=("$PRESET")
          if [ "$PRESET" = ninja-macos ]; then presets+=(ninja-macos-release); fi
          cmake --preset "$PRESET" ${configure[@]+"${configure[@]}"}
          for preset in "${presets[@]}"; do
            cmake --build --preset "$preset"
            ctest --preset "$preset" ${tests[@]+"${tests[@]}"}
          done

  # Libraries and applications only: dvv-build compiles no sources of its own, and its ci.yml runs
  # the privacy lint in the tools job. The lint job needs no third-party prefix, so it runs without
  # waiting for a prime job and a failed prime job cannot skip it. It runs on the host: pulling the
  # CI image took longer than the whole job.
  lint:
    if: inputs.repo != 'dvv-build'
    needs: dvv-build-min
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ inputs.repo }}
          fetch-depth: 0
          submodules: ${{ inputs.app && 'recursive' || 'false' }}
      - *checkout-dvv-build
      - *setup-python
      # The pinned clang-format comes with the tools.
      - *install-tools
      - name: Privacy lint
        run: cmake "-DREPO=${{ inputs.repo }}" -DMODE=commits -P "$DVV_BUILD/tools/privacy-lint.cmake"
      - name: OS blocks
        if: ${{ !cancelled() }}
        run: cmake "-DREPO=${{ inputs.repo }}" -P "$DVV_BUILD/tools/os-blocks.cmake"
      - name: Format
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.repo }}
        run: git ls-files -z '*.h' '*.cpp' '*.mm' | xargs -0 -r clang-format --dry-run --Werror
      # Last, so that the steps above run and report while a branch-only override or an untagged pin
      # exists; the job then fails here. lib: the workflows' dvv-build @vX = the dvv-build line, no
      # override; app: the pins are the tagged releases, relative submodule URLs, @vX = the pinned
      # dvv-build, no override in dvv-deps.txt (needs the network).
      - name: Check the pins
        if: ${{ !cancelled() }}
        run: cmake "-DREPO=${{ inputs.repo }}" "-DMODE=$DVV_LAYOUT" -P "$DVV_BUILD/tools/check-pins.cmake"

  # clang-tidy on the Linux Clang build, with the clang entries that prime-linux fills (the same
  # keys as the linux build jobs).
  tidy:
    if: inputs.repo != 'dvv-build'
    needs: [dvv-build-min, prime-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: *linux-container
    defaults: *linux-defaults
    env:
      TOOLCHAIN: clang
    steps:
      - *checkout
      - *checkout-dvv-build
      - *check-ci-image
      - *fetch-deps
      - *keys-unix
      - *restore-wx
      - *restore-prefix
      - *bootstrap-linux
      # clang-tidy reads sources that include generated files (e.g. dvv_add_shaders headers), which
      # exist only after a build.
      - name: Build
        working-directory: ${{ inputs.repo }}
        run: |
          cmake --preset ninja-clang
          cmake --build --preset ninja-clang
      - name: Tidy
        working-directory: ${{ inputs.repo }}
        # bash with pipefail: a failing list must fail the step, not check nothing.
        shell: bash
        run: |
          # The list is the files of the compile database that are tracked and match the source
          # globs (tools/tidy-files.cmake), so other OSes' sources drop out without being named.
          # The tool path is absolute: this step runs in the repository and $DVV_BUILD is relative
          # to the workspace. The list is printed in a collapsed group so the log shows the Linux
          # Tidy list. One clang-tidy per core, two files each: one serial run was most of the
          # job's time; xargs exits non-zero when any run reports an error.
          cmake "-DDB=$GITHUB_WORKSPACE/$DVV_ROOT/_build/$DVV_REPO/ninja-clang/compile_commands.json" \
                -DREPO=. "-DOUT=$RUNNER_TEMP/tidy-files.txt" -P "$GITHUB_WORKSPACE/$DVV_BUILD/tools/tidy-files.cmake"
          echo "::group::Tidy files"; cat "$RUNNER_TEMP/tidy-files.txt"; echo "::endgroup::"
          tr '\n' '\0' < "$RUNNER_TEMP/tidy-files.txt" |
            xargs -0 -r -P "$(nproc)" -n 2 clang-tidy -p "$GITHUB_WORKSPACE/$DVV_ROOT/_build/$DVV_REPO/ninja-clang" --quiet
