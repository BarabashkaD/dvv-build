# Reusable CI of the dvv repositories, part of dvv-build. Three layouts:
#   lib   a dvv library calls it with
#           jobs: { ci: { uses: <owner>/dvv-build/.github/workflows/dvv-ci.yml@v<X>,
#                         with: { repo: <library name> } } }
#         where X is the dvv-build line of its dvv-deps.txt (check-pins.cmake checks it). The dvv
#         root is the workspace: <library>/, dvv-build/ at tag v<X>, and the dependencies that
#         fetch-deps.cmake clones at their minimum tags.
#   app   an application with the dvv repositories as submodules in libs/ adds `app: true`
#         (and `test-dependencies` to run the libraries' tests at the pins). The dvv root is
#         <app>/libs and dvv-build is the pinned libs/dvv-build.
#   self  dvv-build's own ci.yml calls it with `repo: dvv-build`: dvv-build alone, its own tests.
# Every job installs the tools of the dvv-build in use (CMake 4) before it runs a dvv-build script.
# Jobs: dvv-build-min, then per OS a prime job (prime-windows, prime-linux, prime-macos) that fills
# the toolchain's wxWidgets and third-party caches, then that OS's build jobs (windows, linux,
# macos), which only restore them. Libraries and applications also get lint (privacy lint, Format,
# check-pins; no prime job) and tidy (clang-tidy on the Linux Clang build, after prime-linux).
name: dvv-ci

on:
  workflow_call:
    inputs:
      repo:
        description: Name of the calling repository, e.g. dvv-base
        required: true
        type: string
      app:
        description: The caller is an application with the dvv repositories as submodules in libs/
        required: false
        type: boolean
        default: false
      test-dependencies:
        description: Also build and run the tests of the dvv dependencies (DVV_TEST_DEPENDENCIES)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # self, lib or app (see the header).
  DVV_LAYOUT: ${{ inputs.repo == 'dvv-build' && 'self' || (inputs.app && 'app' || 'lib') }}
  # The dvv root and the dvv-build in use, relative to the workspace.
  DVV_ROOT: ${{ inputs.app && format('{0}/libs', inputs.repo) || '.' }}
  DVV_BUILD: ${{ inputs.app && format('{0}/libs/dvv-build', inputs.repo) || 'dvv-build' }}
  DVV_REPO: ${{ inputs.repo }}

jobs:
  # Lib layout: the dvv-build line of <repo>/dvv-deps.txt, needed before dvv-build is checked out.
  # The rules are those of cmake/DvvDepsFile.cmake: the line may be anywhere, a CR before the line
  # end and a UTF-8 BOM are dropped, it appears exactly once and its version is <major>.<minor>.<patch>.
  # fetch-deps.cmake checks the whole file afterwards. Other layouts: an empty version.
  dvv-build-min:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        if: env.DVV_LAYOUT == 'lib'
        with:
          path: ${{ inputs.repo }}
      - name: Read the dvv-build minimum
        id: read
        if: env.DVV_LAYOUT == 'lib'
        shell: bash
        run: |
          file="$DVV_REPO/dvv-deps.txt"
          if [ ! -f "$file" ]; then
            echo "::error::$file does not exist; it needs a 'dvv-build <major>.<minor>.<patch>' line"
            exit 1
          fi
          lines=$(tr -d '\r' < "$file" | sed '1s/^\xEF\xBB\xBF//' | awk '$1 == "dvv-build"')
          count=$(printf '%s' "$lines" | grep -c '^' || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::$file needs exactly one 'dvv-build <major>.<minor>.<patch>' line, found $count"
            exit 1
          fi
          if ! printf '%s\n' "$lines" | grep -Eq '^[[:space:]]*dvv-build[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$'; then
            echo "::error::$file: bad line '$lines' (expected 'dvv-build <major>.<minor>.<patch>')"
            exit 1
          fi
          version=$(printf '%s\n' "$lines" | awk '{ print $2 }')
          echo "$DVV_REPO needs dvv-build $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Prime jobs, one per OS and toolchain: they fill the two third-party caches of their toolchain
  # once, so the build jobs of that OS only restore them. Two entries per toolchain <tc>:
  #   wxWidgets  path <DVV_ROOT>/_third_party/<tc>-wx (bootstrap's separate wxWidgets prefix), key
  #              wx-<runner.os>-<tc>-<wx hash>-<compiler>: the first 16 hex digits of the hash in
  #              its inputs marker (tools/separate-prefix-hash.cmake) and of a SHA256 of the
  #              compiler's version (Linux: clang-19 --version; Windows: Visual Studio's build
  #              version and the newest MSVC tools folder; macOS: Xcode's and the SDK's version).
  #   prefix     path <DVV_ROOT>/_third_party/<tc>, key third-party-<runner.os>-<tc>-<hash of
  #              deps/**, cmake/DvvThirdParty.cmake and cmake/DvvSpdx.cmake>: the inputs of
  #              bootstrap's own up-to-date stamp.
  # A third entry, downloads (path <DVV_ROOT>/_build/downloads, key downloads-<runner.os>-<hash of
  # the URL and SHA256 lines of deps/versions.cmake>), keeps the archives bootstrap downloads; a
  # prime job with work to do restores it, falling back to an older entry, so it downloads only what
  # the pins changed.
  # A prime job looks both keys up without downloading; when both exist it stops there. Otherwise it
  # restores what exists, bootstraps (the superbuild runs whole: with a fresh build tree it
  # reinstalls the prefix too, and skips wx when its marker matches) and saves each missed entry.
  # The path string is part of a cache entry's version: another job or workflow shares an entry
  # only with the same key and exactly the same path (./_third_party/<tc>[-wx] or
  # <app>/libs/_third_party/<tc>[-wx]).
  prime-windows:
    needs: dvv-build-min
    runs-on: windows-2025
    # A miss of both entries builds the whole third-party prefix, wxWidgets most of it.
    timeout-minutes: 180
    env:
      TOOLCHAIN: msvc
    steps:
      - &checkout
        uses: actions/checkout@v5
        with:
          path: ${{ inputs.repo }}
          submodules: ${{ inputs.app && 'recursive' || 'false' }}
      - &checkout-dvv-build
        uses: actions/checkout@v5
        if: env.DVV_LAYOUT == 'lib'
        with:
          repository: ${{ github.repository_owner }}/dvv-build
          ref: v${{ needs.dvv-build-min.outputs.version }}
          path: dvv-build
      - &setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - &install-tools
        name: Install tools
        run: python -m pip install -r ${{ env.DVV_BUILD }}/tools/requirements.txt
      # Cheap, so before the keys (which read the same Visual Studio installation).
      - &check-vs
        name: Check Visual Studio 2026
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $version = & $vswhere -latest -property catalog_productDisplayVersion
          if (-not $version.StartsWith('18.')) { throw "Visual Studio 2026 (18.x) required, found $version" }
          Write-Host "Visual Studio $version"
      # The key steps are shared by the prime and build jobs of the OS (YAML anchors), so both
      # compute the same keys.
      - &keys-windows
        name: Cache keys
        id: keys
        shell: pwsh
        env:
          PREFIX_HASH: ${{ hashFiles(format('{0}/deps/**', env.DVV_BUILD), format('{0}/cmake/DvvThirdParty.cmake', env.DVV_BUILD), format('{0}/cmake/DvvSpdx.cmake', env.DVV_BUILD)) }}
        run: |
          $script = Join-Path $env:DVV_BUILD 'tools/separate-prefix-hash.cmake'
          $out = (& cmake -DNAME=wxWidgets "-DTOOLCHAIN=$env:TOOLCHAIN" -P $script) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^hash=([0-9a-f]{64})$') {
            throw "tools/separate-prefix-hash.cmake failed ($LASTEXITCODE): $out"
          }
          $wxHash = $Matches[1].Substring(0, 16)
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsBuild = & $vswhere -latest -property catalog_buildVersion
          $vsPath = & $vswhere -latest -property installationPath
          $msvc = (Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1).Name
          if (-not $vsBuild -or -not $msvc) { throw "No Visual Studio build version or MSVC tools folder" }
          $compiler = "$vsBuild`n$msvc`n"
          Write-Host "Compiler: Visual Studio $vsBuild, MSVC $msvc"
          $sha = [Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($compiler))
          $fingerprint = [Convert]::ToHexString($sha).ToLowerInvariant().Substring(0, 16)
          "wx=wx-$env:RUNNER_OS-$env:TOOLCHAIN-$wxHash-$fingerprint" >> $env:GITHUB_OUTPUT
          "prefix=third-party-$env:RUNNER_OS-$env:TOOLCHAIN-$env:PREFIX_HASH" >> $env:GITHUB_OUTPUT
          # The pins only (the URL and SHA256 lines of versions.cmake): an edit elsewhere in the
          # file keeps the downloads entry.
          $pinLines = Get-Content (Join-Path $env:DVV_BUILD 'deps/versions.cmake') |
            Where-Object { $_ -match '^\s*(URL|SHA256)\s' } | ForEach-Object { $_.Trim() }
          $pinBytes = [Text.Encoding]::UTF8.GetBytes(($pinLines -join "`n") + "`n")
          $pins = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($pinBytes)).ToLowerInvariant()
          "downloads=downloads-$env:RUNNER_OS-$pins" >> $env:GITHUB_OUTPUT
      - &lookup-wx
        name: Look up wxWidgets
        id: wx-lookup
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
          lookup-only: true
      - &lookup-prefix
        name: Look up third-party
        id: prefix-lookup
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
          lookup-only: true
      # run=false when both entries exist: every later step of the prime job is skipped.
      - &need
        name: Anything to prime?
        id: need
        shell: bash
        env:
          WX_HIT: ${{ steps.wx-lookup.outputs.cache-hit }}
          PREFIX_HIT: ${{ steps.prefix-lookup.outputs.cache-hit }}
        run: |
          if [ "$WX_HIT" = true ] && [ "$PREFIX_HIT" = true ]; then
            echo "Both cache entries exist; nothing to prime."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "wxWidgets cached: ${WX_HIT:-false}; third-party cached: ${PREFIX_HIT:-false}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Exact keys only (no restore-keys): another wxWidgets or prefix must never be restored.
      - &prime-restore-wx
        name: Restore wxWidgets
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
      - &prime-restore-prefix
        name: Restore third-party
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
      # The downloaded archives (bootstrap keeps them in <root>/_build/downloads), so a prime job
      # downloads only what its pins changed. An older entry may be restored (restore-keys): the
      # superbuild uses an archive only when its SHA256 matches the pin and downloads the others.
      - &prime-restore-downloads
        name: Restore downloads
        id: downloads
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_build/downloads
          key: ${{ steps.keys.outputs.downloads }}
          restore-keys: downloads-${{ runner.os }}-
      # A superbuild of what is missing: it skips wxWidgets when the restored marker matches.
      - name: Bootstrap
        if: steps.need.outputs.run == 'true'
        shell: pwsh
        run: ./${{ env.DVV_BUILD }}/bootstrap.ps1 -Toolchain $env:TOOLCHAIN
      # Saved right after bootstrap. When two runs miss together, the first save wins and the other
      # only warns.
      - &save-wx
        name: Save wxWidgets
        if: steps.need.outputs.run == 'true' && steps.wx-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
      - &save-prefix
        name: Save third-party
        if: steps.need.outputs.run == 'true' && steps.prefix-lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
      - &save-downloads
        name: Save downloads
        if: steps.need.outputs.run == 'true' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DVV_ROOT }}/_build/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}

  prime-linux:
    needs: dvv-build-min
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TOOLCHAIN: clang
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      # Before the keys: the compiler's version is part of the wxWidgets key.
      - &install-linux-compiler
        name: Install Linux compiler
        run: sudo apt-get update && sudo apt-get install -y clang-19 libclang-rt-19-dev libstdc++-14-dev
      - &keys-unix
        name: Cache keys
        id: keys
        shell: bash
        env:
          PREFIX_HASH: ${{ hashFiles(format('{0}/deps/**', env.DVV_BUILD), format('{0}/cmake/DvvThirdParty.cmake', env.DVV_BUILD), format('{0}/cmake/DvvSpdx.cmake', env.DVV_BUILD)) }}
        run: |
          out=$(cmake -DNAME=wxWidgets "-DTOOLCHAIN=$TOOLCHAIN" -P "$DVV_BUILD/tools/separate-prefix-hash.cmake")
          wx_hash=${out#hash=}
          if ! [[ $wx_hash =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tools/separate-prefix-hash.cmake printed '$out'"
            exit 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            compiler=$(clang-19 --version)
          else
            compiler=$(xcodebuild -version && xcrun --show-sdk-version)
          fi
          echo "Compiler:"
          echo "$compiler"
          fingerprint=$(printf '%s\n' "$compiler" | shasum -a 256 | cut -c1-16)
          echo "wx=wx-$RUNNER_OS-$TOOLCHAIN-${wx_hash:0:16}-$fingerprint" >> "$GITHUB_OUTPUT"
          echo "prefix=third-party-$RUNNER_OS-$TOOLCHAIN-$PREFIX_HASH" >> "$GITHUB_OUTPUT"
          # The pins only (the URL and SHA256 lines of versions.cmake): an edit elsewhere in the
          # file keeps the downloads entry.
          pins=$(grep -E '^[[:space:]]*(URL|SHA256)[[:space:]]' "$DVV_BUILD/deps/versions.cmake" |
            sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' | shasum -a 256 | cut -c1-64)
          echo "downloads=downloads-$RUNNER_OS-$pins" >> "$GITHUB_OUTPUT"
      - *lookup-wx
      - *lookup-prefix
      - *need
      - *prime-restore-wx
      - *prime-restore-prefix
      - *prime-restore-downloads
      # Window-system and GUI packages: bootstrap checks them and builds wxWidgets on GTK 3.
      - name: Install Linux window-system packages
        if: steps.need.outputs.run == 'true'
        run: sudo apt-get install -y libgtk-3-dev pkgconf libx11-dev libxcb1-dev libxrandr-dev libwayland-dev zlib1g-dev libpng-dev
      - name: Bootstrap
        if: steps.need.outputs.run == 'true'
        run: ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      - *save-wx
      - *save-prefix
      - *save-downloads

  prime-macos:
    needs: dvv-build-min
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TOOLCHAIN: appleclang
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      - *keys-unix
      - *lookup-wx
      - *lookup-prefix
      - *need
      - *prime-restore-wx
      - *prime-restore-prefix
      - *prime-restore-downloads
      - name: Bootstrap
        if: steps.need.outputs.run == 'true'
        run: |
          brew install ninja
          ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      - *save-wx
      - *save-prefix
      - *save-downloads

  # Build jobs, one matrix per OS after its prime job. They restore both entries and never save;
  # bootstrap takes its fast path (or, if an entry is still missing, builds it). Windows: one job
  # per configuration (`preset` configures, `config` names the build and test presets), so Debug
  # and Release build and test in parallel. Linux runs the workflow preset. macOS runs the
  # configure, build and test steps of its preset itself (see its "Build and test" step); the
  # ninja-macos entry also builds and tests Release, as the workflow preset does.
  windows:
    name: ${{ matrix.name }}
    needs: [dvv-build-min, prime-windows]
    runs-on: windows-2025
    # A missing cache entry builds it first.
    timeout-minutes: 180
    env:
      TOOLCHAIN: msvc
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc, preset: vs2026, config: vs2026 }
          - { name: windows-msvc-release, preset: vs2026, config: vs2026-release }
          - { name: windows-msvc-asan, preset: vs2026-asan, config: vs2026-asan }
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      - &fetch-deps
        name: Fetch the dvv dependencies
        if: env.DVV_LAYOUT == 'lib'
        env:
          DVV_GIT_BASE_URL: ${{ github.server_url }}/${{ github.repository_owner }}
        run: cmake "-DREPO=${{ inputs.repo }}" -P dvv-build/tools/fetch-deps.cmake
      - *check-vs
      - *keys-windows
      - &restore-wx
        name: Restore wxWidgets
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}-wx
          key: ${{ steps.keys.outputs.wx }}
      - &restore-prefix
        name: Restore third-party
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
          key: ${{ steps.keys.outputs.prefix }}
      # The fast path when both entries were restored; otherwise it builds what is missing.
      - name: Bootstrap
        shell: pwsh
        run: ./${{ env.DVV_BUILD }}/bootstrap.ps1 -Toolchain $env:TOOLCHAIN
      # Windows runners have no GPU: the GPU, display and GUI tests exit with 77 and CTest reports
      # them as skipped. The three steps are the workflow preset's steps for one configuration.
      - name: Configure
        working-directory: ${{ inputs.repo }}
        env:
          DVV_TEST_DEPENDENCIES: ${{ inputs.test-dependencies && 'ON' || '' }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        working-directory: ${{ inputs.repo }}
        run: cmake --build --preset ${{ matrix.config }}
      - name: Test
        working-directory: ${{ inputs.repo }}
        env:
          DVV_REQUIRE_FFMPEG: "1"
        run: ctest --preset ${{ matrix.config }}

  linux:
    name: ${{ matrix.name }}
    needs: [dvv-build-min, prime-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TOOLCHAIN: clang
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-clang, preset: ninja-clang }
          - { name: linux-clang-asan, preset: ninja-clang-asan }
          - { name: linux-clang-tsan, preset: ninja-clang-tsan }
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      - *fetch-deps
      - *install-linux-compiler
      # Window-system and GUI packages: bootstrap checks them, the build compiles GTK 3 code and the
      # display tests run under Xvfb. The validation layer is LunarG's prebuilt from the Vulkan SDK.
      - &install-linux-packages
        name: Install Linux window-system packages
        run: sudo apt-get install -y libgtk-3-dev pkgconf libx11-dev libxcb1-dev libxrandr-dev libwayland-dev zlib1g-dev libpng-dev xvfb xauth
      # Linux runs the GPU tests on Mesa's lavapipe (Vulkan 1.4 from noble-updates).
      - name: Install and check the Vulkan device
        run: |
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          cmake -P "$DVV_BUILD/tools/check-vulkan-device.cmake"
      - *keys-unix
      - *restore-wx
      - *restore-prefix
      - &bootstrap-linux
        name: Bootstrap
        run: ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      # The GPU and display tests must run (a missing device or display fails them) with
      # synchronization validation through the third-party prefix's layer, on a virtual X server.
      # NO_AT_BRIDGE keeps GTK from looking for the accessibility bus. TSAN_OPTIONS stays unset: the
      # GPU tests pass their own suppressions through CTest.
      - name: Build and test
        working-directory: ${{ inputs.repo }}
        env:
          DVV_REQUIRE_GPU: "1"
          DVV_REQUIRE_FFMPEG: "1"
          DVV_VK_VALIDATION: sync
          DVV_VK_VALIDATION_REQUIRED: "1"
          NO_AT_BRIDGE: "1"
          DVV_TEST_DEPENDENCIES: ${{ inputs.test-dependencies && 'ON' || '' }}
        run: xvfb-run -a -s "-screen 0 1920x1080x24" cmake --workflow --preset ${{ matrix.preset }}

  macos:
    name: ${{ matrix.name }}
    needs: [dvv-build-min, prime-macos]
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      TOOLCHAIN: appleclang
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-appleclang, preset: ninja-macos }
          - { name: macos-appleclang-asan, preset: ninja-macos-asan }
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      - *install-tools
      - *fetch-deps
      - *keys-unix
      - *restore-wx
      - *restore-prefix
      - name: Bootstrap
        run: |
          brew install ninja
          ./${{ env.DVV_BUILD }}/bootstrap.sh --toolchain "$TOOLCHAIN"
      # The runner's paravirtual Metal device may not run KosmicKrisp (spec C10), so this step never
      # fails the job: it prints the device check and records in `device` whether a Vulkan 1.4 device
      # and a desktop session (WindowServer) exist. The next step runs the GPU tests as required only
      # then and leaves out the display tests otherwise; without a device the GPU tests skip (77).
      - name: Check the Vulkan device
        id: vulkan
        continue-on-error: true
        run: |
          device=0
          if cmake -P "$DVV_BUILD/tools/check-vulkan-device.cmake"; then
            if pgrep -x WindowServer > /dev/null; then
              device=1
            else
              echo "::notice::A Vulkan device was found but there is no desktop session; the display tests are left out"
            fi
          else
            echo "::notice::No usable Vulkan device on this runner; the GPU tests skip and the display tests are left out"
          fi
          echo "device=$device" >> "$GITHUB_OUTPUT"
      # The workflow preset's steps for this entry, with CTest's `-LE display` added unless the
      # device check found a device and a desktop session. With a device the GPU tests are required to
      # run (as on Linux, on KosmicKrisp in the prefix) with synchronization validation; ninja-macos
      # builds and tests Release too. FFmpeg (custom_ffmpeg in the prefix) is required as on Windows and
      # Linux. NO_AT_BRIDGE is a GTK setting and not needed here.
      - name: Build and test
        working-directory: ${{ inputs.repo }}
        env:
          DEVICE: ${{ steps.vulkan.outputs.device }}
          DVV_REQUIRE_FFMPEG: "1"
          DVV_TEST_DEPENDENCIES: ${{ inputs.test-dependencies && 'ON' || '' }}
          PRESET: ${{ matrix.preset }}
          PREFIX: ${{ github.workspace }}/${{ env.DVV_ROOT }}/_third_party/${{ env.TOOLCHAIN }}
        run: |
          tests=()
          if [ "$DEVICE" = 1 ]; then
            export DVV_REQUIRE_GPU=1 DVV_VK_VALIDATION=sync DVV_VK_VALIDATION_REQUIRED=1
            export VK_DRIVER_FILES="$PREFIX/share/vulkan/icd.d/libkosmickrisp_icd.json"
          else
            tests=(-LE display)
          fi
          presets=("$PRESET")
          if [ "$PRESET" = ninja-macos ]; then presets+=(ninja-macos-release); fi
          cmake --preset "$PRESET"
          for preset in "${presets[@]}"; do
            cmake --build --preset "$preset"
            ctest --preset "$preset" ${tests[@]+"${tests[@]}"}
          done

  # Libraries and applications only: dvv-build compiles no sources of its own, and its ci.yml runs
  # the privacy lint in the tools job. The lint job needs no third-party prefix, so it runs without
  # waiting for a prime job and a failed prime job cannot skip it.
  lint:
    if: inputs.repo != 'dvv-build'
    needs: dvv-build-min
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ${{ inputs.repo }}
          fetch-depth: 0
          submodules: ${{ inputs.app && 'recursive' || 'false' }}
      - *checkout-dvv-build
      - *setup-python
      # The pinned clang-format comes with the tools.
      - *install-tools
      - name: Privacy lint
        run: cmake "-DREPO=${{ inputs.repo }}" -DMODE=commits -P "$DVV_BUILD/tools/privacy-lint.cmake"
      - name: Format
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.repo }}
        run: git ls-files -z '*.h' '*.cpp' | xargs -0 -r clang-format --dry-run --Werror
      # Last, so that the steps above run and report while a branch-only override or an untagged pin
      # exists; the job then fails here. lib: the workflows' dvv-build @vX = the dvv-build line, no
      # override; app: the pins are the tagged releases, relative submodule URLs, @vX = the pinned
      # dvv-build, no override in dvv-deps.txt (needs the network).
      - name: Check the pins
        if: ${{ !cancelled() }}
        run: cmake "-DREPO=${{ inputs.repo }}" "-DMODE=$DVV_LAYOUT" -P "$DVV_BUILD/tools/check-pins.cmake"

  # clang-tidy on the Linux Clang build, with the clang entries that prime-linux fills (the same
  # keys as the linux build jobs).
  tidy:
    if: inputs.repo != 'dvv-build'
    needs: [dvv-build-min, prime-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TOOLCHAIN: clang
    steps:
      - *checkout
      - *checkout-dvv-build
      - *setup-python
      # The pinned clang-tidy comes with the tools.
      - *install-tools
      - *fetch-deps
      - *install-linux-compiler
      - *install-linux-packages
      - *keys-unix
      - *restore-wx
      - *restore-prefix
      - *bootstrap-linux
      # clang-tidy reads sources that include generated files (e.g. dvv_add_shaders headers), which
      # exist only after a build.
      - name: Build
        working-directory: ${{ inputs.repo }}
        run: |
          cmake --preset ninja-clang
          cmake --build --preset ninja-clang
      - name: Tidy
        working-directory: ${{ inputs.repo }}
        # bash with pipefail: a failing git ls-files must fail the step, not check nothing.
        shell: bash
        run: |
          # ** reaches src subfolders; * stops at '/' for tests and tools, so tests/compile_fail and
          # tests/package (built separately) stay out. Windows-only sources (*_win32.cpp, *_msw.cpp)
          # are not in the Linux compile database. One clang-tidy per core, two files each: one serial
          # run was most of the job's time; xargs exits non-zero when any run reports an error.
          git ls-files -z ':(glob)src/**/*.cpp' ':(glob)tests/*.cpp' ':(glob)tools/*.cpp' \
              ':(exclude,glob)**/*_win32.cpp' ':(exclude,glob)**/*_msw.cpp' |
            xargs -0 -r -P "$(nproc)" -n 2 \
              clang-tidy -p "$GITHUB_WORKSPACE/$DVV_ROOT/_build/$DVV_REPO/ninja-clang" --quiet
