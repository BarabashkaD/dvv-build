# CI of dvv-build itself: the script tests and the privacy lint on Windows and Linux (tools) and,
# on Linux, that the pinned CI image is public and is the published image of this commit's inputs, and
# dvv-build's own CMake project through the reusable workflow in the self layout (self: the
# third-party superbuild, the wxWidgets and custom_ffmpeg consumers and the same script tests).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request at a time. Only pull-request runs are cancelled by a newer
# push, so a run on main can always reach its third-party cache save.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tools:
    name: tools-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tools
        timeout-minutes: 15
        run: python -m pip install --retries 10 --timeout 60 -r tools/requirements.txt
      - name: SPDX tests
        run: cmake -P tests/spdx/test_spdx.cmake
      - name: Third-party gate tests
        run: cmake -P tests/spdx/test_third_party_gate.cmake
      - name: Third-party versions tests
        run: cmake -P tests/deps/test_versions.cmake
      - name: Superbuild script tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/superbuild-scripts-test" -P tests/deps/test_superbuild_scripts.cmake
      - name: Vulkan device check tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/check-vulkan-device-test" -P tests/ci/test_check_vulkan_device.cmake
      - name: Vulkan driver selection tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/select-vulkan-driver-test" -P tests/ci/test_select_vulkan_driver.cmake
      - name: CI image inputs tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/ci-image-inputs-test" -P tests/ci/test_ci_image_inputs.cmake
      - name: CI image check tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/check-ci-image-test" -P tests/ci/test_check_ci_image.cmake
      - name: Privacy lint tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/privacy-lint-test" -P tests/privacy/test_privacy_lint.cmake
      - name: Preset files tests
        run: |
          cmake -P tests/cmake/test_presets_consistency.cmake
          cmake "-DWORK_DIR=${{ runner.temp }}/presets-drift-test" -P tests/cmake/test_presets_consistency_drift.cmake
      - name: DvvDeps tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/dvv-deps-test" -DGENERATOR=Ninja -P tests/cmake/test_dvv_deps.cmake
      - name: fetch-deps tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/fetch-deps-test" -P tests/tools/test_fetch_deps.cmake
      - name: check-pins tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/check-pins-test" -P tests/tools/test_check_pins.cmake
      - name: os-blocks tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/os-blocks-test" -P tests/tools/test_os_blocks.cmake
      - name: tidy-files tests
        run: cmake "-DWORK_DIR=${{ runner.temp }}/tidy-files-test" -P tests/tools/test_tidy_files.cmake
      - name: Privacy lint
        run: cmake "-DREPO=${{ github.workspace }}" -DMODE=commits -P tools/privacy-lint.cmake
      - name: CI image pin
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          OWNER: ${{ vars.DVV_CI_IMAGE_OWNER || github.repository }}
        run: |
          set -euo pipefail
          owner=${OWNER%%/*}; owner=${owner,,}
          mapfile -t pins < <(grep -E '^  DVV_CI_IMAGE: dvv-build-ci@sha256:[0-9a-f]{64}$' .github/workflows/dvv-ci.yml || true)
          if [ "${#pins[@]}" -ne 1 ]; then
            echo "::error::dvv-ci.yml must have exactly one DVV_CI_IMAGE pin line, found ${#pins[@]}"
            exit 1
          fi
          pin=${pins[0]#  DVV_CI_IMAGE: }
          h=$(cmake -P tools/ci-image-inputs.cmake)
          h=${h#hash=}
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          ref=ghcr.io/$owner/$pin
          if ! label=$(docker buildx imagetools inspect "$ref" --format '{{ index .Image.Config.Labels "dvv.ci-image.inputs" }}'); then
            echo "::error::the pinned image cannot be pulled anonymously (private, missing or mistyped): $ref"
            exit 1
          fi
          if [ "$label" != "$h" ]; then
            echo "::error::the pinned image was built from inputs $label, this commit has $h"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "ghcr.io/$owner/dvv-build-ci:inputs-${h:0:16}" --format '{{ .Manifest.Digest }}')
          if [ "$digest" != "${pin#dvv-build-ci@}" ]; then
            echo "::error::inputs-${h:0:16} is $digest, dvv-ci.yml pins $pin"
            exit 1
          fi

  self:
    uses: ./.github/workflows/dvv-ci.yml
    with:
      repo: dvv-build
